interface:
  display_name: "Nakama Investigate Patterns"
  short_description: "Write one sourced research note"
  default_prompt: "Use $nakama-investigate-patterns to research this question against primary sources and write a dated note under research/ with a sources table. Run every agent and long command in a Rex tab. Never start an embedded subagent."
policy:
  allow_implicit_invocation: false
