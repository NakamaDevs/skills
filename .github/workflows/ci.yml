name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  PR_BASE_REVISION: ${{ github.event.pull_request.base.sha || 'HEAD^1' }}
  PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || '' }}
  PR_TITLE: ${{ github.event.pull_request.title || '' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # nakama-workload: portable-non-server
    # Public repository: use GitHub-hosted Linux, including Dependabot.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate Mise runtime state
        shell: bash
        run: |
          echo "MISE_DATA_DIR=${RUNNER_TEMP}/mise-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
          echo "MISE_CACHE_DIR=${RUNNER_TEMP}/mise-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.7.17
          cache: false
          install_args: actionlint erlang elixir gitleaks python
      - run: mise run verify
