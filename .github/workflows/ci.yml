name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # nakama-workload: server-only
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        'nakama-dependabot-linux-x64' ||
        'nakama-linux-x64'
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate Mise runtime state
        shell: bash
        run: |
          echo "MISE_DATA_DIR=${RUNNER_TEMP}/mise-data" >> "${GITHUB_ENV}"
          echo "MISE_CACHE_DIR=${RUNNER_TEMP}/mise-cache" >> "${GITHUB_ENV}"
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.7.17
          cache: false
          install_args: actionlint erlang elixir gitleaks python
      - run: mise run verify
