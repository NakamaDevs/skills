min_version = "2026.7.17"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-x64", "macos-arm64", "windows-x64"]

[settings.task]
run_auto_install = false

[tools]
actionlint = "1.7.12"
elixir = "1.19.5-otp-28"
erlang = "28.4.1"
gitleaks = "8.30.0"
prek = "0.4.11"
python = "3.14.6"

[tasks."security:secrets"]
run = "python scripts/nakama_governance.py secrets history"

[tasks."security:secrets:staged"]
run = "python scripts/nakama_governance.py secrets staged"

[tasks."governance:test"]
run = ["python scripts/nakama_governance.py self-test", "python scripts/nakama_governance.py runner-policy", "python scripts/nakama_governance.py pr-branch", "python scripts/nakama_governance.py pr-title"]

[tasks."catalog:test"]
run = ["python scripts/validate_catalog.py", "python -m unittest discover -s tests"]

[tasks."lane-task-contract:test"]
run = [
  "elixir skills/define-lane-task-contract/test/lane_task_envelope_test.exs",
  "elixir skills/define-lane-task-contract/test/lane_task_result_test.exs",
  "elixir skills/define-lane-task-contract/test/notify_parent_test.exs",
]

[tasks."verify:quick"]
run = [
  "mise run governance:test",
  "mise run catalog:test",
  "mise run lane-task-contract:test",
  "actionlint",
]

[tasks.verify]
description = "Run organization and catalog gates"
run = ["mise run verify:quick", "mise run security:secrets"]

[tasks."git-hooks:install"]
run = "python scripts/nakama_governance.py install-hooks"

[tasks."tools:lock"]
run = "mise lock --platform linux-x64,macos-x64,macos-arm64,windows-x64"
